// Midfielder wire protocol, version 1.
//
// Single source of truth for both the Kotlin (Wire) and C# (Google.Protobuf) code.
// Every frame on the wire is: 4-byte big-endian unsigned length N, then N bytes of an encoded Envelope.
// Rules (enforced on both sides, see docs/PROTOCOL.md):
//   * N must be 1..MAX_FRAME (8 MiB). Anything else closes the connection before allocating.
//   * Unknown oneof cases are ignored, so newer peers can add messages without breaking older ones.
//   * Field numbers are never reused. Add new fields; don't renumber.
syntax = "proto3";

package midfielder.v1;

option java_package = "dev.midfielder.proto";
option csharp_namespace = "Midfielder.Protocol";

message Envelope {
  oneof body {
    // Session setup (control connection).
    Hello hello = 10;
    PairRequest pair_request = 11;
    PairResult pair_result = 12;
    Ping ping = 13;
    Pong pong = 14;
    Bye bye = 15;

    // Clipboard.
    ClipboardItem clipboard = 20;

    // File transfer (offers travel on the control connection).
    TransferOffer transfer_offer = 30;
    TransferAnswer transfer_answer = 31;
    TransferCancel transfer_cancel = 32;

    // Data connection (a separate TLS connection per file).
    DataOpen data_open = 40;
    DataResume data_resume = 41;
    DataDone data_done = 42;
    AudioOpen audio_open = 43;                     // first frame of a data connection that carries an audio stream
    AudioChunk audio_chunk = 44;                   // audio on that connection

    // Optional features. A side sends these only to peers that advertise the matching capability
    // (in Hello, updated by FeaturesChanged) and only while its own switch for the feature is on.
    FeaturesChanged features_changed = 50;
    AudioRequest audio_request = 52;               // capability "audio": start/stop an audio route
    NotificationPosted notification_posted = 55;   // capability "notify": phone -> PC
    NotificationRemoved notification_removed = 56; // capability "notify": phone -> PC
    NotificationAction notification_action = 57;   // PC -> phone (reply, button, dismiss)
    BatteryStatus battery_status = 60;             // capability "battery": either way
    RingRequest ring_request = 61;                 // capability "ring": either way
    MediaState media_state = 70;                   // capability "media": what is playing on the sender
    MediaCommand media_command = 71;               // capability "media": control the receiver's player
    AudioOffer audio_offer = 80;                   // capability "audio": a stream is ready, open a data connection
    AudioStop audio_stop = 81;                     // capability "audio": a stream ended (either side)
    CallState call_state = 90;                     // capability "call": phone -> PC
    CallCommand call_command = 91;                 // capability "call": PC -> phone
    PresenceKey presence_key = 95;                 // capability "presence": PC -> phone, key for the BLE beacon
  }
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_WINDOWS = 1;
  DEVICE_KIND_ANDROID = 2;
  DEVICE_KIND_OTHER = 3;
}

// First frame each side sends on a control connection.
message Hello {
  string device_id = 1;          // hex of the first 16 bytes of the certificate's SHA-256 fingerprint
  string device_name = 2;        // human readable, e.g. "Ajay's laptop" (max 64 chars)
  DeviceKind kind = 3;
  uint32 protocol_version = 4;   // 1
  repeated string capabilities = 5; // e.g. "clipboard.text", "clipboard.image", "file"
}

// Sent by the dialer right after Hello when pairing for the first time.
// proof = HMAC-SHA256(secret, "midfielder-pair-client-v1" || client_fp || server_fp)
message PairRequest {
  bytes proof = 1;
}

// proof = HMAC-SHA256(secret, "midfielder-pair-server-v1" || client_fp || server_fp)
message PairResult {
  bool accepted = 1;
  bytes proof = 2;
  string reason = 3;
}

message Ping {
  int64 sent_at_ms = 1;
}

message Pong {
  int64 echo_sent_at_ms = 1;
}

message Bye {
  string reason = 1;
}

enum ClipKind {
  CLIP_KIND_UNSPECIFIED = 0;
  CLIP_KIND_TEXT = 1;   // inline_data is UTF-8
  CLIP_KIND_IMAGE = 2;  // inline_data is PNG
}

message ClipboardItem {
  bytes id = 1;                  // 16 random bytes
  string origin_device_id = 2;
  int64 created_at_ms = 3;
  ClipKind kind = 4;
  string mime = 5;               // "text/plain" or "image/png"
  bytes content_sha256 = 6;      // hash of the content bytes, used for loop prevention
  bytes inline_data = 7;         // content when it fits in a frame
  uint64 size = 8;               // content size in bytes
  string transfer_id = 9;        // set instead of inline_data for large images (sent as a transfer)
  bool sensitive = 10;           // receiver must not keep it in history
  bool catch_up = 11;            // re-sent on reconnect; receiver applies it only if newer than its own latest
}

enum TransferPurpose {
  TRANSFER_PURPOSE_UNSPECIFIED = 0;
  TRANSFER_PURPOSE_FILE = 1;
  TRANSFER_PURPOSE_CLIPBOARD = 2;
}

message FileEntry {
  string name = 1;               // file name only, never a path; receiver sanitizes again
  uint64 size = 2;
  bytes sha256 = 3;               // optional; when empty the receiver relies on the DataDone trailer hash
  string mime = 4;
  int64 modified_ms = 5;
}

message TransferOffer {
  string transfer_id = 1;        // 32 hex chars
  repeated FileEntry files = 2;
  TransferPurpose purpose = 3;
}

message TransferAnswer {
  string transfer_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message TransferCancel {
  string transfer_id = 1;
  string reason = 2;
}

// First frame on a data connection, always sent by the dialer.
message DataOpen {
  string transfer_id = 1;
  uint32 file_index = 2;
}

// Sent by the receiving side after DataOpen: how many bytes it already has.
// The sender then streams raw bytes [offset, size) with no further framing.
message DataResume {
  uint64 offset = 1;
}

// Sent twice per file: first by the sender right after the last raw byte (ok = true, sha256 = hash of the
// whole file, computed while streaming), then by the receiver once it has verified the hash.
message DataDone {
  bool ok = 1;
  string reason = 2;
  bytes sha256 = 3;
}

// ---------------------------------------------------------------------------------------------------------
// Optional features
// ---------------------------------------------------------------------------------------------------------

// The sender's full capability list changed (a feature was switched on or off). Replaces the list from Hello.
message FeaturesChanged {
  repeated string capabilities = 1;
}

message NotificationButton {
  string id = 1;                 // opaque, echoed back in NotificationAction
  string title = 2;
}

// A notification on the phone. Re-sent with the same key when it is updated.
message NotificationPosted {
  string key = 1;                // stable per notification on the phone
  string app_package = 2;
  string app_name = 3;
  string title = 4;
  string text = 5;
  int64 posted_at_ms = 6;
  bytes icon_png = 7;            // small app icon, <= 8 KiB, optional
  bool can_reply = 8;            // the notification has an inline reply action
  repeated NotificationButton buttons = 9; // at most 3
}

message NotificationRemoved {
  string key = 1;
}

// From the PC: act on a phone notification. Exactly one of reply_text, button_id or dismiss is set.
message NotificationAction {
  string key = 1;
  string reply_text = 2;
  string button_id = 3;
  bool dismiss = 4;
}

message BatteryStatus {
  uint32 level = 1;              // 0..100
  bool charging = 2;
  bool plugged = 3;
}

// Make the receiver ring loudly (find my phone / find my PC); start = false stops it.
message RingRequest {
  bool start = 1;
}

// What is playing on the sender. active = false means nothing is (clears the receiver's display).
message MediaState {
  bool active = 1;
  string app_name = 2;
  string title = 3;
  string artist = 4;
  string album = 5;
  bytes art_jpeg = 6;            // <= 64 KiB, optional; omitted when unchanged since the last MediaState
  bool art_unchanged = 7;
  bool playing = 8;
  int64 position_ms = 9;         // at updated_at_ms
  int64 duration_ms = 10;
  int64 updated_at_ms = 11;      // sender clock
  bool can_next = 12;
  bool can_previous = 13;
  bool can_seek = 14;
}

enum MediaAction {
  MEDIA_ACTION_UNSPECIFIED = 0;
  MEDIA_ACTION_PLAY = 1;
  MEDIA_ACTION_PAUSE = 2;
  MEDIA_ACTION_TOGGLE = 3;
  MEDIA_ACTION_NEXT = 4;
  MEDIA_ACTION_PREVIOUS = 5;
  MEDIA_ACTION_SEEK = 6;
}

// Control the receiver's current player (the one its last MediaState described).
message MediaCommand {
  MediaAction action = 1;
  int64 seek_ms = 2;             // for MEDIA_ACTION_SEEK
}

enum AudioRoute {
  AUDIO_ROUTE_UNSPECIFIED = 0;
  AUDIO_ROUTE_PHONE_TO_PC = 1;   // the PC becomes the phone's Bluetooth speaker
  AUDIO_ROUTE_PC_TO_PHONE = 2;   // the PC's sound streamed to the phone over Wi-Fi
}

// Ask the peer to start or stop a route (e.g. the phone's "Play PC audio here").
message AudioRequest {
  AudioRoute route = 1;
  bool start = 2;
}

// The sender has an audio stream ready: the dialer opens a data connection whose first frame is AudioOpen.
message AudioOffer {
  string stream_id = 1;          // 32 hex chars
  uint32 sample_rate = 2;        // 44100 or 48000
  uint32 channels = 3;           // 2
}

message AudioStop {
  string stream_id = 1;
  string reason = 2;
}

message AudioOpen {
  string stream_id = 1;
}

// 20 ms of interleaved signed 16-bit little-endian PCM. Silence is sent as zeros, so the stream never stalls.
message AudioChunk {
  uint32 seq = 1;
  bytes pcm = 2;
}

// ---- Calls (capability "call") -------------------------------------------------------------------------------

enum CallPhase {
  CALL_PHASE_UNSPECIFIED = 0;
  CALL_PHASE_RINGING = 1;        // incoming, not answered yet
  CALL_PHASE_ACTIVE = 2;         // answered or dialled (off hook)
  CALL_PHASE_ENDED = 3;
}

message CallState {
  uint32 call_id = 1;            // grows with each call on the phone
  CallPhase phase = 2;
  string number = 3;             // may be empty (private number, or no call-log permission)
  string contact_name = 4;       // empty when unknown or contacts aren't allowed
  bytes photo = 5;               // contact photo, JPEG <= 16 KiB, optional
  int64 started_at_ms = 6;       // when the phase began (ACTIVE: when the call was answered)
  bool can_answer = 7;           // the phone allows answering and declining from the PC
  bool can_sms = 8;              // the phone allows the quick SMS reply
  string sms_text = 9;           // the quick reply the phone will send
}

enum CallAction {
  CALL_ACTION_UNSPECIFIED = 0;
  CALL_ACTION_ANSWER = 1;
  CALL_ACTION_DECLINE = 2;
  CALL_ACTION_END = 3;
  CALL_ACTION_SILENCE = 4;       // stop the ringing, keep the call
  CALL_ACTION_SMS_REPLY = 5;     // decline and text the caller (text, or the phone's own quick reply)
}

message CallCommand {
  uint32 call_id = 1;
  CallAction action = 2;
  string text = 3;
}

// ---- Presence (capability "presence") ------------------------------------------------------------------------

// The key the phone's BLE beacon uses: token = first 8 bytes of
// HMAC-SHA256(key, "midfielder-presence-v1" || slot as big-endian int64), slot = unix seconds / 900.
message PresenceKey {
  bytes key = 1;                 // 32 random bytes, one per paired phone
}

