name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Kotlin core + C# core + cross-language interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: gradle/actions/setup-gradle@v4
      - name: C# core tests
        run: dotnet test windows/Midfielder.Core.Tests -c Release
      - name: Build headless C# node for interop
        run: dotnet build windows/Midfielder.Cli -c Release
      - name: Kotlin core tests (incl. Kotlin <-> C# interop)
        working-directory: android
        env:
          ANDROID_HOME: "" # :core needs no SDK; keep this job independent of it
          ANDROID_SDK_ROOT: ""
        run: ./gradlew :core:test -PinteropCli=${{ github.workspace }}/windows/Midfielder.Cli/bin/Release/net8.0/Midfielder.Cli.dll

  android:
    name: Android app (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug + release APKs and run lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Verify APK signatures and manifest
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in android/app/build/outputs/apk/*/*.apk; do
            echo "== $f"
            "$BT/apksigner" verify --verbose --print-certs "$f"
            "$BT/aapt2" dump badging "$f" | head -25
          done
      - name: Install-ready APK (release build, minified)
        uses: actions/upload-artifact@v4
        with:
          name: midfielder-android
          path: android/app/build/outputs/apk/release/*.apk
      - name: Debug APK (with LeakCanary, for development)
        uses: actions/upload-artifact@v4
        with:
          name: midfielder-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  android-install:
    name: Android install + launch (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: midfielder-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-smoke.sh
      - name: Screenshots of each tab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screens-${{ matrix.api }}
          path: screens/
          if-no-files-found: ignore

  windows:
    name: Windows app (build + tests on Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core tests on Windows (SChannel TLS 1.3)
        run: dotnet test windows/Midfielder.Core.Tests -c Release
      - name: Windows clipboard tests (real clipboard on the runner)
        run: dotnet test windows/Midfielder.App.Tests -c Release
      - name: Publish tray app (single self-contained Midfielder.exe, no .NET install needed)
        run: >-
          dotnet publish windows/Midfielder.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: midfielder-windows
          path: publish/
