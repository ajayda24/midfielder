name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Kotlin core + C# core + cross-language interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: gradle/actions/setup-gradle@v4
      - name: C# core tests
        run: dotnet test windows/Midfielder.Core.Tests -c Release
      - name: Build headless C# node for interop
        run: dotnet build windows/Midfielder.Cli -c Release
      - name: Kotlin core tests (incl. Kotlin <-> C# interop)
        working-directory: android
        env:
          ANDROID_HOME: "" # :core needs no SDK; keep this job independent of it
          ANDROID_SDK_ROOT: ""
        run: ./gradlew :core:test -PinteropCli=${{ github.workspace }}/windows/Midfielder.Cli/bin/Release/net8.0/Midfielder.Cli.dll

  android:
    name: Android app (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug + release APKs and run lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Verify APK signatures and manifest
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in android/app/build/outputs/apk/*/*.apk; do
            echo "== $f"
            "$BT/apksigner" verify --verbose --print-certs "$f"
            "$BT/aapt2" dump badging "$f" | head -25
          done
      - name: Install-ready APK (release build, minified)
        uses: actions/upload-artifact@v4
        with:
          name: midfielder-android
          path: android/app/build/outputs/apk/release/*.apk
      - name: Debug APK (with LeakCanary, for development)
        uses: actions/upload-artifact@v4
        with:
          name: midfielder-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  android-install:
    name: Android install + launch (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: midfielder-android
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: midfielder-android-debug
          path: apk-debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pre-download the emulator and system image (Google's mirror sometimes serves a corrupt zip)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4; do
            yes | "$SDKM" --install emulator "system-images;android-${{ matrix.api }};google_apis;x86_64" > /dev/null && \
              [ -d "$ANDROID_HOME/system-images/android-${{ matrix.api }}/google_apis/x86_64" ] && break
            echo "attempt $i failed; retrying"
            rm -rf "$ANDROID_HOME/system-images/android-${{ matrix.api }}" "$ANDROID_HOME/.temp"
            sleep $((i * 10))
          done
      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/android-smoke.sh
      - name: Screenshots of each tab
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screens-${{ matrix.api }}
          path: screens/
          if-no-files-found: ignore

  windows:
    name: Windows app (build + tests on Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core tests on Windows (SChannel TLS 1.3)
        run: dotnet test windows/Midfielder.Core.Tests -c Release
      - name: Windows app tests (real clipboard, registry, main window + screenshots)
        env:
          MIDFIELDER_SCREENS: ${{ github.workspace }}/screens
        run: dotnet test windows/Midfielder.App.Tests -c Release
      - name: Screenshots of each page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screens
          path: screens/
          if-no-files-found: ignore
      - name: Publish tray app (single self-contained Midfielder.exe, no .NET install needed)
        run: >-
          dotnet publish windows/Midfielder.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
      - uses: microsoft/setup-msbuild@v2
      - name: Build the Windows 11 context-menu handler (MidfielderShell.dll)
        run: msbuild windows/Midfielder.Shell/MidfielderShell.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo
      - name: Pack and sign the sparse package (Midfielder.msix)
        shell: pwsh
        run: |
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory -Filter "10.*" |
            Where-Object { Test-Path (Join-Path $_.FullName "x64\makeappx.exe") } | Sort-Object Name | Select-Object -Last 1
          $makeappx = Join-Path $kit.FullName "x64\makeappx.exe"
          $signtool = Join-Path $kit.FullName "x64\signtool.exe"
          Copy-Item windows/Midfielder.Shell/bin/MidfielderShell.dll publish/
          $stage = New-Item -ItemType Directory -Force msix-stage
          Copy-Item windows/packaging/Assets -Destination $stage -Recurse
          (Get-Content windows/packaging/AppxManifest.xml -Raw) -replace 'Version="1.0.0.0"', 'Version="1.0.${{ github.run_number }}.0"' |
            Set-Content (Join-Path $stage AppxManifest.xml) -Encoding utf8
          & $makeappx pack /d $stage /p publish/Midfielder.msix /nv /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          & $signtool sign /fd SHA256 /f windows/packaging/midfielder-sideload.pfx /p midfielder-sideload publish/Midfielder.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Copy-Item windows/packaging/midfielder-sideload.cer publish/
          Get-ChildItem publish | Format-Table Name, Length
      - name: Check the sparse package registers (what "Enable Windows 11 menu" does)
        shell: pwsh
        run: |
          Import-Certificate -FilePath publish/midfielder-sideload.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $dir = (Resolve-Path publish).Path
          Add-AppxPackage -Path (Join-Path $dir Midfielder.msix) -ExternalLocation $dir
          $pkg = Get-AppxPackage -Name Midfielder
          if (-not $pkg) { throw "sparse package not registered" }
          $pkg | Format-List Name, Version, PackageFullName, InstallLocation
          Remove-AppxPackage -Package $pkg.PackageFullName
          Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Subject -eq 'CN=Midfielder sideload' | Remove-Item
      - uses: actions/upload-artifact@v4
        with:
          name: midfielder-windows
          path: publish/

  screens:
    name: Publish screenshots (ci-screens branch)
    needs: [android-install, windows]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-screens*'
          path: screens
          merge-multiple: true
      - name: Push screenshots to the ci-screens branch (overwritten each run)
        run: |
          mkdir -p screens && cd screens
          ls -la
          echo "Screenshots from CI run ${{ github.run_number }} (${{ github.sha }})" > README.md
          git init -q -b ci-screens
          git config user.name "midfielder-ci"
          git config user.email "midfielder-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from CI run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
