name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Kotlin core + C# core + cross-language interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: gradle/actions/setup-gradle@v4
      - name: C# core tests
        run: dotnet test windows/Midfielder.Core.Tests -c Release
      - name: Build headless C# node for interop
        run: dotnet build windows/Midfielder.Cli -c Release
      - name: Kotlin core tests (incl. Kotlin <-> C# interop)
        working-directory: android
        env:
          ANDROID_HOME: "" # :core needs no SDK; keep this job independent of it
          ANDROID_SDK_ROOT: ""
        run: ./gradlew :core:test -PinteropCli=${{ github.workspace }}/windows/Midfielder.Cli/bin/Release/net8.0/Midfielder.Cli.dll

  android:
    name: Android app (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug + release APKs and run lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: midfielder-android
          path: android/app/build/outputs/apk/**/*.apk

  windows:
    name: Windows app (build + tests on Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core tests on Windows (SChannel TLS 1.3)
        run: dotnet test windows/Midfielder.Core.Tests -c Release
      - name: Publish tray app
        run: dotnet publish windows/Midfielder.App -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: midfielder-windows
          path: publish/
